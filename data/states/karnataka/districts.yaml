# Karnataka districts and the district-level offices a citizen can approach.
# Office templates (office_types) are shared; a district may override one under `offices`.
# No phone numbers or addresses are stored (website "" + verify true = not checked yet).
# Names in Kannada and all entries are review: pending.
state: karnataka
source: Government of Karnataka district list (31 districts); legal basis cited per office type
review: pending
office_types:
  dlsa:
    name: District Legal Services Authority
    name_kn: ಜಿಲ್ಲಾ ಕಾನೂನು ಸೇವೆಗಳ ಪ್ರಾಧಿಕಾರ
    helps_with: free lawyer and legal advice
    helpline: "15100"
    source: Legal Services Authorities Act, 1987, Section 9
  labour:
    name: District labour office (Karnataka Labour Department)
    helps_with: unpaid or low wages, working conditions
    source: Karnataka Labour Department
  dc:
    name: Deputy Commissioner's office
    helps_with: revenue, land records, certificates, district administration
    source: Karnataka Land Revenue Act, 1964
  police:
    name: District Police (Superintendent of Police)
    helps_with: police complaints when the station does not act
    helpline: "112"
    note: Some cities have a Police Commissionerate instead
    source: Karnataka Police Act, 1963
  zp:
    name: Zilla Panchayat (Chief Executive Officer)
    helps_with: rural development and panchayat works
    source: Karnataka Gram Swaraj and Panchayat Raj Act, 1993
