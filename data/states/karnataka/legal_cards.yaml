- id: ka-sakala
  title: Time limits for government services in Karnataka
  keywords: sakala time limit services delay government office deadline
  summary: The Karnataka Sakala Services Act, 2011 sets time limits for delivering notified government services to citizens. The time limit is different for each service.
  what_to_do:
    - Note the date you applied and your application number.
  escalate_offices: [dc]
  source: Karnataka Sakala Services Act, 2011
