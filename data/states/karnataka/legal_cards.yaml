- id: ka-legal-aid
  title: Free legal aid in Karnataka
  keywords: lawyer advocate free legal aid kslsa dlsa taluk legal services committee ವಕೀಲ ಉಚಿತ
  summary: Karnataka has a State Legal Services Authority (KSLSA), a District Legal Services Authority in every district and Taluk Legal Services Committees. They give free legal services to eligible people. The national legal aid helpline is 15100.
  summary_kn: ಕರ್ನಾಟಕದಲ್ಲಿ ರಾಜ್ಯ ಕಾನೂನು ಸೇವೆಗಳ ಪ್ರಾಧಿಕಾರ ಮತ್ತು ಪ್ರತಿ ಜಿಲ್ಲೆಯಲ್ಲಿ ಜಿಲ್ಲಾ ಕಾನೂನು ಸೇವೆಗಳ ಪ್ರಾಧಿಕಾರ ಇದೆ. ಅರ್ಹರಿಗೆ ಉಚಿತ ವಕೀಲರು ಮತ್ತು ಕಾನೂನು ಸಲಹೆ ಸಿಗುತ್ತದೆ.
  what_to_do:
    - Go to the District Legal Services Authority or the Taluk Legal Services Committee.
    - Call the national legal aid helpline 15100.
  escalate_offices: [dlsa]
  source: Legal Services Authorities Act, 1987, Sections 6, 9 and 11A
  review: pending
