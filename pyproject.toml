[project]
name = "synaptix"
version = "0.1.0"
description = "Offline-first civic AI: legal info, political jargon in plain words, and who-holds-which-power, in Indian languages and Indian Sign Language."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
slm = ["llama-cpp-python>=0.3"]
sign = ["mediapipe<1", "opencv-python>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
synaptix = "synaptix.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synaptix*"]
